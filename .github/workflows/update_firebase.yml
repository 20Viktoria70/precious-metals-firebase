# ==================================================
# Автоматичне оновлення даних у Firebase
# GitHub Actions
# ==================================================

name: Update Precious Metals Data

# Умови запуску

on:
  # Автоматичний запуск щодня о 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  # Можливість ручного запуску
  workflow_dispatch:

# Дозволи

permissions:
  contents: read

jobs:
  update-firebase:

    runs-on: ubuntu-latest

    steps:

      # Отримання файлів репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # Встановлення Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Встановлення бібліотек
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Запуск оновлення Firebase
      - name: Update Firebase database
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python update_firebase.py
